<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>잠긴 문서</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23264a3f'/%3E%3Cpath d='M17 19h30v5H17zm0 11h30v5H17zm0 11h19v5H17z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{--bg:#f6f6f3;--fg:#1b1b1b;--mut:#6b6b66;--line:#e2e2dc;--card:#fff;--acc:#1f5c4d;--accbg:#e8f1ed;--vw:50vw;--hh:52px}
@media (prefers-color-scheme:dark){:root{--bg:#151515;--fg:#ececec;--mut:#a3a39d;--line:#2f2f2f;--card:#1d1d1d;--acc:#86c9b4;--accbg:#1f2c28}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
/* lock */
#lock{height:100%;display:flex;align-items:center;justify-content:center}
#lock form{width:min(320px,86vw)}
#lock label{display:block;font-size:13px;margin-bottom:6px}
#lock input{width:100%;font:inherit;padding:9px 11px;border:1px solid #cfcfca;border-radius:6px;background:var(--card);color:var(--fg)}
#lock button{margin-top:10px;width:100%;padding:9px 11px;border:0;border-radius:6px;background:#1b1b1b;color:#fff;cursor:pointer}
#lock button[disabled]{opacity:.5;cursor:default}
#lm{min-height:1.6em;font-size:13px;margin-top:8px;color:#b3261e}
@media (prefers-color-scheme:dark){#lock button{background:#ececec;color:#151515}#lock input{border-color:#3a3a3a}}
/* app */
#app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px 14px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap;position:relative;z-index:30}
.top h1{font-size:15px;margin:0;font-weight:650;white-space:nowrap}
.tabs{display:flex;gap:4px}
.tabs button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 13px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tabs .n{opacity:.7;margin-left:3px;font-size:12px}
.quick{display:flex;gap:5px;flex-wrap:wrap;align-items:center;font-size:12.5px}
.quick>span{color:var(--mut);margin-right:2px}
.quick button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:2px 8px;cursor:pointer;white-space:nowrap}
.quick button:hover,.quick button.cur{border-color:var(--acc);color:var(--acc)}
.wrap{flex:1;min-height:0;display:flex}
main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
#tA{flex:1;display:flex;flex-direction:column;min-height:0}
.abar{display:flex;gap:10px;align-items:center;padding:6px 14px;font-size:12.5px;color:var(--mut);border-bottom:1px solid var(--line);flex-wrap:wrap}
.abar b{color:var(--fg);font-weight:600}
.abar .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 9px;cursor:pointer;font-size:12.5px;color:var(--fg);text-decoration:none;white-space:nowrap;display:inline-block}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn[aria-disabled=true]{opacity:.45;pointer-events:none}
#aF,#nF{flex:1;border:0;width:100%;background:#fff}
#tN{flex:1;display:flex;flex-direction:column;min-height:0}
.nbtns{display:flex;gap:5px;flex-wrap:wrap}
.nbtns button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
#tF{flex:1;overflow:auto;min-height:0}
.ftools{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 16px 9px;border-bottom:1px solid var(--line)}
.srow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#q{width:min(460px,100%);padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:inherit}
#q:focus{outline:2px solid var(--acc);outline-offset:-1px}
.sinfo{color:var(--mut);font-size:12.5px}
.fchips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.fchips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:2px 10px;cursor:pointer;font-size:12.5px}
.fchips button:hover{border-color:var(--acc);color:var(--acc)}
.fchips .n{color:var(--mut);margin-left:4px}
#list{padding:2px 16px 80px}
.grp{scroll-margin-top:100px}
.grp h2{font-size:14.5px;margin:20px 0 8px;display:flex;gap:6px;align-items:baseline}
.grp h2 .n,.grp h3 .n{color:var(--mut);font-weight:400;font-size:12.5px}
.grp h3{font-size:12.5px;color:var(--mut);margin:14px 0 6px;font-weight:600}
.rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.row{display:flex;align-items:center;gap:12px;padding:8px 12px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;width:100%}
.row:last-child{border-bottom:0}
.row:hover,.card:hover,.row.cur,.card.cur{background:var(--accbg)}
.ic{flex:none;width:42px;height:30px;border-radius:5px;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;background:#ecece7;color:#555;overflow:hidden}
.ic img{width:100%;height:100%;object-fit:cover}
.ic.pdf{background:#f6e4e2;color:#a2342b}.ic.xlsx{background:#e2f0e6;color:#21703f}.ic.md{background:#e5e9f3;color:#34508f}
@media (prefers-color-scheme:dark){.ic{background:#2a2a2a;color:#bbb}.ic.pdf{background:#3a2422;color:#f0a39b}.ic.xlsx{background:#1f3326;color:#8fd3a6}.ic.md{background:#232a3a;color:#a9bbe6}}
.dn{flex:1;min-width:0}
.dn b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dn small{color:var(--mut);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dm{color:var(--mut);font-size:12.5px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0;overflow:hidden;cursor:pointer;text-align:left;min-width:0}
.th{aspect-ratio:1/1;background:#efefea;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
@media (prefers-color-scheme:dark){.th{background:#262626}}
.th img{width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .15s}
.th img.ok{opacity:1}
.th .bd{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.62);color:#fff;font-size:10px;padding:1px 5px;border-radius:4px}
.cn{font-size:12px;line-height:1.35;padding:6px 8px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.cm{font-size:11px;color:var(--mut);padding:2px 8px 7px}
.res .ritem{border-bottom:1px solid var(--line)}
.res .ritem:last-child{border-bottom:0}
.res .row{border-bottom:0}
.hits{padding:0 12px 9px 66px;display:flex;flex-direction:column;gap:3px}
.hit{border:0;background:transparent;text-align:left;padding:3px 6px;border-radius:5px;cursor:pointer;font-size:12.5px;color:var(--mut);line-height:1.45}
.hit:hover{background:var(--accbg);color:var(--fg)}
.hit b{color:var(--acc);margin-right:6px;font-weight:600}
mark{background:#ffe58a;color:#1b1b1b;border-radius:2px;padding:0 1px}
.empty{color:var(--mut);padding:30px 0}
/* viewer */
#vw{position:fixed;top:var(--hh);right:0;bottom:0;width:var(--vw);min-width:420px;background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:20;box-shadow:-10px 0 28px rgba(0,0,0,.08)}
body.wide #vw{width:100vw;min-width:0}
body.vopen:not(.wide) main{margin-right:var(--vw)}
@media (max-width:1099px){#vw{width:100vw;min-width:0}body.vopen:not(.wide) main{margin-right:0}#bWide{display:none}}
.grip{position:absolute;left:-5px;top:0;bottom:0;width:10px;cursor:col-resize;z-index:3}
body.wide .grip{display:none}
.vbar{display:flex;gap:6px 10px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.vname{flex:1;min-width:220px}
.vname b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vname small{color:var(--mut);font-size:11.5px;display:block}
.vact{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.vact .idx{color:var(--mut);font-size:12px;min-width:52px;text-align:center}
.pg{display:inline-flex;gap:4px;align-items:center;font-size:12px;color:var(--mut)}
.pg input{width:54px;padding:2px 5px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--fg);font:inherit}
.vbody{flex:1;min-height:0;position:relative;overflow:auto;background:#ededE8}
@media (prefers-color-scheme:dark){.vbody{background:#111}}
.vbody iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.vbody img.fit{position:absolute;inset:0;margin:auto;max-width:calc(100% - 16px);max-height:calc(100% - 16px);object-fit:contain;cursor:zoom-in}
.vbody img.full{position:static;display:block;max-width:none;max-height:none;margin:0 auto;cursor:zoom-out}
.vbody video{position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%}
.vbody .prog{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--card);padding:10px 14px;border-radius:8px;border:1px solid var(--line);font-size:12.5px;white-space:nowrap;z-index:2}
.vbody .ghost{position:absolute;inset:0;margin:auto;max-width:calc(100% - 16px);max-height:calc(100% - 16px);object-fit:contain;opacity:.35;filter:blur(1px)}
.pages{padding:10px}
.pages figure{margin:0 0 14px}
.pages figcaption{font-size:12px;color:var(--mut);margin-bottom:4px}
.pages img{display:block;width:100%;height:auto;background:#fff}
.mdv{padding:20px 26px 60px;max-width:900px;margin:0 auto;background:var(--card);min-height:100%;line-height:1.65}
.mdv h1{font-size:20px}.mdv h2{font-size:17px;margin-top:28px}.mdv h3{font-size:15px;margin-top:22px}
.mdv table{border-collapse:collapse;margin:10px 0;font-size:13px}
.mdv td,.mdv th{border:1px solid var(--line);padding:5px 8px;vertical-align:top;text-align:left}
.mdv th{background:var(--bg)}
.mdv blockquote{margin:10px 0;padding:6px 12px;border-left:3px solid var(--line);color:var(--mut)}
.mdv code{background:var(--bg);padding:0 4px;border-radius:4px;font-size:12.5px}
.mdv pre{background:var(--bg);padding:10px;border-radius:6px;overflow:auto}
.err{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:var(--mut);font-size:13px}
</style>
</head>
<body>
<div id="lock">
  <form id="lf" autocomplete="off">
    <label for="lp">비밀번호</label>
    <input id="lp" type="password" autofocus>
    <button id="lb" type="submit">열기</button>
    <div id="lm"></div>
  </form>
</div>
<div id="app" hidden>
  <header class="top" id="top">
    <h1 id="ttl"></h1>
    <nav class="tabs"><button id="tabA" class="on" type="button">아젠다</button><button id="tabF" type="button">자료<span class="n" id="cnt"></span></button><button id="tabN" type="button" hidden>분석<span class="n" id="cntN"></span></button></nav>
    <div class="quick" id="quick"><span>바로 열기</span></div>
  </header>
  <div class="wrap">
    <main>
      <section id="tA">
        <div class="abar"><b id="aName"></b><span id="aSaved"></span><span class="sp"></span><button class="btn" id="aTab" type="button" aria-disabled="true">새 탭에서 열기</button><a class="btn" id="aDl" aria-disabled="true">HTML 받기</a></div>
        <iframe id="aF" title="아젠다"></iframe>
      </section>
      <section id="tF" hidden>
        <div class="ftools">
          <div class="srow"><input id="q" type="search" placeholder="파일명, PDF·엑셀 본문 검색  ( / )" autocomplete="off"><span class="sinfo" id="sinfo"></span></div>
          <div class="fchips" id="fchips"></div>
        </div>
        <div id="list"></div>
      </section>
      <section id="tN" hidden>
        <div class="abar"><span class="nbtns" id="nBtns"></span><span id="nInfo"></span><span class="sp"></span><button class="btn" id="nTab" type="button" aria-disabled="true">새 탭에서 열기</button><a class="btn" id="nDl" aria-disabled="true">받기</a></div>
        <iframe id="nF" title="분석"></iframe>
      </section>
    </main>
  </div>
</div>
<aside id="vw" hidden>
  <div class="grip" id="grip" title="끌어서 폭 조절"></div>
  <div class="vbar">
    <div class="vname"><b id="vT"></b><small id="vP"></small></div>
    <div class="vact">
      <span class="pg" id="vPg" hidden><input id="vPage" type="number" min="1" title="PDF 쪽"><span id="vPn"></span><span id="vSp" hidden>&nbsp;· 지면 p.<input id="vSpread" type="number" min="1" title="브랜드북에 인쇄된 쪽 번호"></span></span>
      <button class="btn" id="bPrev" type="button" title="이전 (←)">←</button><span class="idx" id="vI"></span><button class="btn" id="bNext" type="button" title="다음 (→)">→</button>
      <button class="btn" id="bWide" type="button">넓게</button>
      <button class="btn" id="bTab" type="button">새 탭</button>
      <a class="btn" id="bDl">받기</a>
      <a class="btn" id="bDrv" target="_blank" rel="noopener noreferrer">드라이브 원본</a>
      <button class="btn" id="bX" type="button" title="닫기 (Esc)">닫기</button>
    </div>
  </div>
  <div class="vbody" id="vB"></div>

<script>
(function(){
'use strict';
var CFG = JSON.parse(document.getElementById('cfg').textContent);
var SK = 'bk:' + location.pathname;
var KEY = null, MAN = null, ITEMS = [], BYID = {}, GMAP = {};
function isAna(it){ var g = GMAP[it.group]; return !!(g && g.tab === 'ana'); }
function $(id){ return document.getElementById(id); }
function el(tag, attrs, kids){
  var e = document.createElement(tag);
  if (attrs) for (var k in attrs) { if (attrs[k] == null) continue; if (k === 'text') e.textContent = attrs[k]; else if (k === 'html') e.innerHTML = attrs[k]; else e.setAttribute(k, attrs[k]); }
  (kids || []).forEach(function(c){ if (c != null) e.append(c); });
  return e;
}
function b64(s){ var bin = atob(s), n = bin.length, u = new Uint8Array(n); for (var i = 0; i < n; i++) u[i] = bin.charCodeAt(i); return u; }
function ub64(u){ var s = ''; for (var i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
function gunzip(buf){ return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer(); }
function dec(u){ return crypto.subtle.decrypt({name:'AES-GCM', iv:u.subarray(0, 12)}, KEY, u.subarray(12)); }
function fmtSize(n){ if (n >= 1048576) return (n / 1048576).toFixed(n >= 10485760 ? 0 : 1) + 'MB'; return Math.max(1, Math.round(n / 1024)) + 'KB'; }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* ---------- unlock ---------- */
async function derive(pw){
  var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(CFG.salt), iterations:CFG.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, true, ['decrypt']);
}
async function openManifest(){
  var pt = await dec(b64(CFG.m));
  return JSON.parse(new TextDecoder().decode(await gunzip(pt)));
}
var lf = $('lf'), lm = $('lm'), lb = $('lb');
lf.addEventListener('submit', function(e){
  e.preventDefault();
  if (!(window.crypto && crypto.subtle && window.DecompressionStream)) { lm.textContent = '이 브라우저에서는 열 수 없습니다. 최신 Chrome이나 Edge로 열어 주세요.'; return; }
  var pw = $('lp').value.trim(); if (!pw) return;
  lb.disabled = true; lm.style.color = 'inherit'; lm.textContent = '여는 중';
  setTimeout(async function(){
    try {
      KEY = await derive(pw);
      MAN = await openManifest();
      try { sessionStorage.setItem(SK, ub64(new Uint8Array(await crypto.subtle.exportKey('raw', KEY)))); } catch (x) {}
      start();
    } catch (err) {
      KEY = null; lb.disabled = false; lm.style.color = ''; lm.textContent = '비밀번호가 맞지 않습니다.';
    }
  }, 30);
});
(async function(){
  var s = null; try { s = sessionStorage.getItem(SK); } catch (x) {}
  if (!s || !(window.crypto && crypto.subtle && window.DecompressionStream)) return;
  try { KEY = await crypto.subtle.importKey('raw', b64(s), {name:'AES-GCM'}, true, ['decrypt']); MAN = await openManifest(); start(); }
  catch (x) { KEY = null; try { sessionStorage.removeItem(SK); } catch (y) {} }
})();

/* ---------- payload fetch + decrypt ---------- */
var blobs = new Map(), urls = new Map();
function getBlob(ref, onProg){
  if (blobs.has(ref.p)) return blobs.get(ref.p);
  var pr = (async function(){
    var res = await fetch(ref.p);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var total = ref.n || +res.headers.get('content-length') || 0, buf;
    if (onProg && res.body && total > 1500000) {
      var rd = res.body.getReader(), parts = [], got = 0;
      for (;;) { var r = await rd.read(); if (r.done) break; parts.push(r.value); got += r.value.length; onProg(Math.min(got, total), total); }
      buf = new Uint8Array(got); var off = 0; parts.forEach(function(c){ buf.set(c, off); off += c.length; });
    } else buf = new Uint8Array(await res.arrayBuffer());
    var pt = await dec(buf);
    if (ref.z) pt = await gunzip(pt);
    return new Blob([pt], {type: ref.m});
  })();
  blobs.set(ref.p, pr);
  pr.catch(function(){ blobs.delete(ref.p); });
  return pr;
}
async function getURL(ref, onProg){
  if (urls.has(ref.p)) return urls.get(ref.p);
  var b = await getBlob(ref, onProg), u = URL.createObjectURL(b);
  urls.set(ref.p, u); return u;
}

/* ---------- thumbnails (lazy) ---------- */
var tq = [], tActive = 0;
var io = new IntersectionObserver(function(ents){
  ents.forEach(function(en){ if (en.isIntersecting) { io.unobserve(en.target); tq.push(en.target); pump(); } });
}, {rootMargin: '900px 0px'});
function pump(){
  while (tActive < 6 && tq.length) {
    var img = tq.shift(), it = ITEMS[+img.dataset.i]; tActive++;
    (function(img){
      getURL(it.thumb).then(function(u){ img.onload = function(){ img.classList.add('ok'); }; img.src = u; })
        .catch(function(){}).finally(function(){ tActive--; pump(); });
    })(img);
  }
}
function thumbEl(it, i){
  if (it.thumb) { var im = el('img', {alt:'', 'data-i': i}); io.observe(im); return im; }
  return null;
}

/* ---------- app ---------- */
function start(){
  ITEMS = MAN.items;
  MAN.groups.forEach(function(g){ GMAP[g.key] = g; });
  ITEMS.forEach(function(it, i){ BYID[it.id] = i; });
  $('lock').hidden = true; $('app').hidden = false;
  document.title = MAN.title;
  $('ttl').textContent = MAN.title;
  var anaIdx = []; ITEMS.forEach(function(it, i){ if (isAna(it)) anaIdx.push(i); });
  $('cnt').textContent = ITEMS.length - anaIdx.length;
  if (anaIdx.length) {
    $('tabN').hidden = false; $('cntN').textContent = anaIdx.length; anaCur = anaIdx[0];
    anaIdx.forEach(function(i){ var b = el('button', {class:'btn', type:'button', 'data-i': i, title: ITEMS[i].name, text: ITEMS[i].tab_label || ITEMS[i].name}); b.onclick = function(){ showAna(i); }; $('nBtns').append(b); });
  }
  window.addEventListener('message', function(e){ if (e.origin !== location.origin) return; var d = e.data; if (d && d.openId && BYID[d.openId] != null) openItem(BYID[d.openId], null, null); });
  // agenda
  $('aName').textContent = MAN.agenda.name;
  $('aSaved').textContent = MAN.agenda.saved || '';
  getURL(MAN.agenda.ref).then(function(u){
    $('aF').src = u;
    var t = $('aTab'); t.setAttribute('aria-disabled', 'false'); t.onclick = function(){ window.open(u, '_blank'); };
    var d = $('aDl'); d.href = u; d.download = MAN.agenda.name; d.setAttribute('aria-disabled', 'false');
  }).catch(function(e){ $('aSaved').textContent = '아젠다를 불러오지 못했습니다 (' + e.message + '). 새로고침해 주세요.'; });
  // quick chips
  var qk = $('quick');
  ITEMS.forEach(function(it, i){ if (it.short) qk.append(el('button', {type:'button', 'data-i': i, title: it.name, text: it.short})); });
  qk.addEventListener('click', function(e){ var b = e.target.closest('button[data-i]'); if (b) openItem(+b.dataset.i, null, null); });
  // tabs
  $('tabA').onclick = function(){ setTab('A'); };
  $('tabF').onclick = function(){ setTab('F'); };
  $('tabN').onclick = function(){ setTab('N'); };
  try { var st = sessionStorage.getItem(SK + ':tab'); if (st === 'F' || (st === 'N' && anaIdx.length)) setTab(st); } catch (x) {}
  renderList();
  measure(); window.addEventListener('resize', measure);
}
function setTab(t){
  ['A', 'F', 'N'].forEach(function(k){ $('tab' + k).classList.toggle('on', t === k); $('t' + k).hidden = t !== k; });
  if (t === 'N' && anaCur != null && !anaShown) showAna(anaCur);
  try { sessionStorage.setItem(SK + ':tab', t); } catch (x) {}
}
/* ---------- analysis tab ---------- */
var anaCur = null, anaShown = false, anaUrls = {};
var MDCSS = 'body{margin:0;background:#fff;color:#1b1b1b;font:14.5px/1.7 system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}.mdv{max-width:1000px;margin:0 auto;padding:26px 28px 90px}h1{font-size:22px;line-height:1.35}h2{font-size:18px;margin-top:34px;padding-top:14px;border-top:1px solid #e6e6e0}h3{font-size:15.5px;margin-top:24px}table{border-collapse:collapse;margin:12px 0;font-size:13.5px;width:100%}td,th{border:1px solid #e2e2dc;padding:6px 9px;vertical-align:top;text-align:left}th{background:#f4f4f1}blockquote{margin:10px 0;padding:6px 14px;border-left:3px solid #d9d9d2;color:#555}code{background:#f4f4f1;padding:0 4px;border-radius:4px;font-size:12.5px}pre{background:#f4f4f1;padding:10px;border-radius:6px;overflow:auto}a.fid{color:#1f5c4d;text-decoration:none;border-bottom:1px dotted #1f5c4d;white-space:nowrap;cursor:pointer}a.fid:hover{background:#e8f1ed}@media (prefers-color-scheme:dark){body{background:#161616;color:#e8e8e8}th,code,pre{background:#222}td,th{border-color:#333}blockquote{color:#aaa;border-color:#444}a.fid{color:#86c9b4;border-color:#86c9b4}h2{border-color:#2e2e2e}}';
function mdDoc(title, body){
  return '<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>' + esc(title) + '</title><style>' + MDCSS + '</style></head><body><main class="mdv">' + body + '</main><script>document.addEventListener("click",function(e){var a=e.target.closest("a.fid");if(a){e.preventDefault();parent.postMessage({openId:a.getAttribute("data-f")},location.origin);}});<\/script></body></html>';
}
async function showAna(i){
  anaCur = i; anaShown = true;
  var it = ITEMS[i], info = $('nInfo'), tb = $('nTab'), dl = $('nDl');
  document.querySelectorAll('#nBtns button').forEach(function(b){ b.classList.toggle('on', +b.dataset.i === i); });
  info.textContent = it.path; setBtn(tb, false); setBtn(dl, false);
  try {
    var u = anaUrls[it.id];
    if (!u) {
      if (it.kind === 'md') { var txt = await (await getBlob(it.view)).text(); u = URL.createObjectURL(new Blob([mdDoc(it.name, md2html(txt, true))], {type: 'text/html'})); }
      else u = await getURL(it.view, function(g, t){ if (anaCur === i) info.textContent = '불러오는 중 ' + fmtSize(g) + ' / ' + fmtSize(t); });
      anaUrls[it.id] = u;
    }
    if (anaCur !== i) return;
    $('nF').src = u; info.textContent = it.path;
    setBtn(tb, true); tb.onclick = function(){ window.open(u, '_blank'); };
    var du = await getURL(it.view); if (anaCur !== i) return;
    dl.href = du; dl.download = it.dlname || it.name; setBtn(dl, true);
  } catch (e) { info.textContent = '불러오지 못했습니다 (' + e.message + '). 다시 눌러 주세요.'; anaShown = false; }
}
function measure(){ document.documentElement.style.setProperty('--hh', $('top').offsetHeight + 'px'); }

function metaLine(it){
  var a = [it.ext.toUpperCase()];
  if (it.pages) a.push(it.pages + '쪽');
  if (it.rows) a.push('행 ' + it.rows);
  if (it.w && it.h) a.push(it.w + '×' + it.h);
  a.push(fmtSize(it.size));
  return a.join(' · ');
}
function rowEl(it, i){
  var ic = el('span', {class: 'ic ' + it.ext}, [it.thumb && it.group !== 'docs' ? thumbEl(it, i) : document.createTextNode(it.ext.toUpperCase())]);
  return el('button', {class:'row', type:'button', 'data-i': i}, [ic, el('span', {class:'dn'}, [el('b', {text: it.name}), el('small', {text: it.path})]), el('span', {class:'dm', text: metaLine(it)})]);
}
function cardEl(it, i){
  var th = el('span', {class:'th'});
  var im = thumbEl(it, i);
  if (im) th.append(im); else th.append(el('span', {class:'ic ' + it.ext, text: it.ext.toUpperCase()}));
  if (it.kind === 'video') th.append(el('span', {class:'bd', text:'영상'}));
  else if (it.ext === 'gif') th.append(el('span', {class:'bd', text:'GIF'}));
  else if (it.pages > 1) th.append(el('span', {class:'bd', text: it.pages + '쪽'}));
  return el('button', {class:'card', type:'button', 'data-i': i, title: it.name}, [th, el('span', {class:'cn', text: it.name}), el('span', {class:'cm', text: metaLine(it)})]);
}
var groupLists = {};
function renderList(){
  var list = $('list'), fc = $('fchips');
  list.innerHTML = ''; fc.innerHTML = '';
  MAN.groups.forEach(function(g){
    var idx = []; ITEMS.forEach(function(it, i){ if (it.group === g.key) idx.push(i); });
    groupLists[g.key] = idx;
    if (g.tab) return;
    fc.append(el('button', {type:'button', 'data-g': g.key}, [document.createTextNode(g.label), el('span', {class:'n', text: idx.length})]));
    var sec = el('section', {class:'grp', id: 'g-' + g.key}, [el('h2', {}, [document.createTextNode(g.label), el('span', {class:'n', text: idx.length + '개'})])]);
    if (g.key === 'docs') {
      var rows = el('div', {class:'rows'}); idx.forEach(function(i){ rows.append(rowEl(ITEMS[i], i)); }); sec.append(rows);
    } else {
      var subs = {}, order = [];
      idx.forEach(function(i){ var s = ITEMS[i].sub || ''; if (!(s in subs)) { subs[s] = []; order.push(s); } subs[s].push(i); });
      order.sort(function(a, b){ return (a === '' ? -1 : b === '' ? 1 : a.localeCompare(b, 'ko', {numeric:true})); });
      order.forEach(function(s){
        if (order.length > 1) sec.append(el('h3', {}, [document.createTextNode(s || '폴더 바로 아래'), el('span', {class:'n', text: ' ' + subs[s].length + '개'})]));
        var grid = el('div', {class:'grid'}); subs[s].forEach(function(i){ grid.append(cardEl(ITEMS[i], i)); }); sec.append(grid);
      });
    }
    list.append(sec);
  });
  fc.onclick = function(e){
    var b = e.target.closest('button[data-g]'); if (!b) return;
    if ($('q').value) { $('q').value = ''; runSearch(); }
    var s = $('g-' + b.dataset.g); if (s) s.scrollIntoView({block:'start'});
  };
  list.onclick = function(e){
    var h = e.target.closest('.hit'); if (h) { openItem(+h.dataset.i, h.dataset.p || null, curResults, h.dataset.r || null); return; }
    var b = e.target.closest('[data-i].row, [data-i].card'); if (b) openItem(+b.dataset.i, null, $('q').value ? curResults : null);
  };
}

/* ---------- search ---------- */
var curResults = null, sTimer = null;
$('q').addEventListener('input', function(){ clearTimeout(sTimer); sTimer = setTimeout(runSearch, 160); });
function hl(s, toks){
  var out = esc(s);
  toks.forEach(function(t){ if (!t) return; var re = new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'), 'gi'); out = out.replace(re, function(m){ return '<mark>' + m + '</mark>'; }); });
  return out;
}
function snippet(text, toks){
  var low = text.toLowerCase(), pos = -1;
  toks.forEach(function(t){ var p = low.indexOf(t); if (p >= 0 && (pos < 0 || p < pos)) pos = p; });
  var a = Math.max(0, pos - 45), b = Math.min(text.length, pos + 95);
  return (a > 0 ? '…' : '') + text.slice(a, b) + (b < text.length ? '…' : '');
}
function runSearch(){
  var q = $('q').value.trim().toLowerCase(), list = $('list');
  if (!q) { curResults = null; $('sinfo').textContent = ''; renderList(); return; }
  var toks = q.split(/\s+/).filter(Boolean), res = [], nh = 0;
  ITEMS.forEach(function(it, i){
    if (isAna(it)) return;
    var hay = (it.name + ' ' + it.path + ' ' + (it.short || '')).toLowerCase();
    var nameHit = toks.every(function(t){ return hay.indexOf(t) >= 0; });
    var hits = [];
    (it.text || []).forEach(function(pt){ var low = pt[1].toLowerCase(); if (toks.every(function(t){ return low.indexOf(t) >= 0; })) hits.push(pt); });
    if (nameHit || hits.length) { res.push({i: i, hits: hits}); nh += hits.length; }
  });
  curResults = res.map(function(r){ return r.i; });
  $('sinfo').textContent = '파일 ' + res.length + '개' + (nh ? ' · 본문 일치 ' + nh + '곳' : '');
  list.innerHTML = '';
  if (!res.length) { list.append(el('div', {class:'empty', text:'찾은 결과가 없습니다.'})); return; }
  var box = el('div', {class:'rows res', style:'margin-top:14px'});
  res.forEach(function(r){
    var it = ITEMS[r.i], wrap = el('div', {class:'ritem'}, [rowEl(it, r.i)]);
    if (r.hits.length) {
      var hs = el('div', {class:'hits'});
      r.hits.slice(0, 5).forEach(function(pt){
        var lab = pt[0], m = /^p\.(\d+)$/.exec(lab), rr = /^행 (\d+)$/.exec(lab);
        hs.append(el('button', {class:'hit', type:'button', 'data-i': r.i, 'data-p': m ? m[1] : null, 'data-r': rr ? rr[1] : null, html: '<b>' + esc(lab) + '</b>' + hl(snippet(pt[1], toks), toks)}));
      });
      if (r.hits.length > 5) hs.append(el('span', {class:'sinfo', text: '외 ' + (r.hits.length - 5) + '곳'}));
      wrap.append(hs);
    }
    box.append(wrap);
  });
  list.append(box);
}

/* ---------- viewer ---------- */
var V = {i: -1, ctx: null, url: null, page: null, token: 0};
function ctxOf(i, list){ return list && list.indexOf(i) >= 0 ? list : groupLists[ITEMS[i].group]; }
function markCur(){
  document.querySelectorAll('.cur').forEach(function(x){ x.classList.remove('cur'); });
  if (V.i < 0) return;
  document.querySelectorAll('[data-i="' + V.i + '"].row, [data-i="' + V.i + '"].card, .quick [data-i="' + V.i + '"]').forEach(function(x){ x.classList.add('cur'); });
}
function setBtn(a, on){ a.setAttribute('aria-disabled', on ? 'false' : 'true'); }
function pdfSrc(u, it, page){ return u + '#' + (page ? 'page=' + page + '&' : '') + 'navpanes=0&view=' + ((it.pages || 1) > 1 ? 'FitH' : 'Fit'); }
function goPdfPage(n){
  var it = ITEMS[V.i]; if (!V.url || !it || it.kind !== 'pdf') return;
  n = Math.max(1, +n || 1); if (it.pages) n = Math.min(n, it.pages);
  $('vPage').value = n; V.page = n;
  var box = $('vB'); box.innerHTML = ''; box.append(el('iframe', {src: pdfSrc(V.url, it, n), title: it.name}));
}
function progress(box, txt){ var p = box.querySelector('.prog'); if (!p) { p = el('div', {class:'prog'}); box.append(p); } p.textContent = txt; }
function openItem(i, page, list, row){
  var it = ITEMS[i], tok = ++V.token;
  V.i = i; V.ctx = ctxOf(i, list); V.url = null; V.page = page ? +page : null;
  document.body.classList.add('vopen'); $('vw').hidden = false; measure();
  $('vT').textContent = it.name;
  $('vP').textContent = it.path + ' · ' + metaLine(it) + (it.note ? ' · ' + it.note : '');
  var k = V.ctx.indexOf(i); $('vI').textContent = (k + 1) + ' / ' + V.ctx.length;
  $('bPrev').disabled = k <= 0; $('bNext').disabled = k >= V.ctx.length - 1;
  var drv = $('bDrv');
  if (it.drive) { drv.href = 'https://drive.google.com/file/d/' + it.drive + '/view'; drv.hidden = false; } else drv.hidden = true;
  var dl = $('bDl'), tb = $('bTab'); setBtn(dl, false); tb.disabled = true; dl.removeAttribute('href');
  dl.hidden = it.kind === 'pages'; tb.hidden = it.kind === 'pages' || it.kind === 'md';
  $('vPg').hidden = it.kind !== 'pdf';
  $('vSp').hidden = !it.spread; $('vSpread').value = '';
  if (it.kind === 'pdf') { $('vPage').value = V.page || 1; $('vPn').textContent = '/ ' + (it.pages || '?') + '쪽'; }
  markCur();
  var box = $('vB'); box.innerHTML = ''; box.scrollTop = 0;
  if (it.thumb && (it.kind === 'pdf' || it.kind === 'image')) getURL(it.thumb).then(function(u){ if (tok === V.token && !box.querySelector('iframe, img.fit')) box.prepend(el('img', {class:'ghost', src: u, alt:''})); }).catch(function(){});
  function onProg(g, t){ if (tok === V.token) progress(box, '불러오는 중 ' + fmtSize(g) + ' / ' + fmtSize(t)); }
  function fail(e){ if (tok !== V.token) return; box.innerHTML = ''; box.append(el('div', {class:'err', html: '불러오지 못했습니다 (' + esc(e.message || e) + ')<br><br>'}, [el('button', {class:'btn', type:'button', text:'다시 시도'})])); box.querySelector('.err button').onclick = function(){ openItem(i, page, list, row); }; }
  if (it.kind === 'pages') {
    var wrapP = el('div', {class:'pages'}); box.append(wrapP);
    it.pp.forEach(function(ref, n){
      var fig = el('figure', {}, [el('figcaption', {text: (n + 1) + ' / ' + it.pp.length + '쪽'})]), im = el('img', {alt: (n + 1) + '쪽'});
      if (it.ppd && it.ppd[n]) im.style.aspectRatio = it.ppd[n][0] + ' / ' + it.ppd[n][1];
      fig.append(im); wrapP.append(fig);
      getURL(ref).then(function(u){ if (tok === V.token) im.src = u; }).catch(function(){ fig.append(el('div', {class:'sinfo', text:'이 쪽을 불러오지 못했습니다.'})); });
    });
    if (V.page && wrapP.children[V.page - 1]) setTimeout(function(){ if (tok === V.token) wrapP.children[V.page - 1].scrollIntoView({block:'start'}); }, 30);
    return;
  }
  progress(box, '불러오는 중');
  getURL(it.view, onProg).then(async function(u){
    if (tok !== V.token) return;
    V.url = u; box.innerHTML = '';
    if (it.kind === 'pdf') { box.append(el('iframe', {src: pdfSrc(u, it, V.page), title: it.name})); }
    else if (it.kind === 'xlsx') {
      var fr = el('iframe', {src: u, title: it.name}); box.append(fr);
      if (row) fr.addEventListener('load', function(){ try { var d = fr.contentDocument, trs = d.querySelectorAll('tbody tr'); for (var j = 0; j < trs.length; j++) { if (trs[j].firstChild && trs[j].firstChild.textContent === String(row)) { trs[j].scrollIntoView({block:'center'}); trs[j].style.background = '#fff4c2'; break; } } } catch (x) {} });
    }
    else if (it.kind === 'image') {
      var im = el('img', {class:'fit', src: u, alt: it.name}); box.append(im);
      im.onclick = function(){ var f = im.classList.toggle('full'); im.classList.toggle('fit', !f); };
    }
    else if (it.kind === 'video') { box.append(el('video', {src: u, controls: '', playsinline: ''})); }
    else if (it.kind === 'md') { var txt = await (await getBlob(it.view)).text(); box.append(el('div', {class:'mdv', html: md2html(txt)})); }
    tb.disabled = false;
    var dref = it.orig || it.view;
    var du = it.orig ? await getURL(it.orig).catch(function(){ return null; }) : u;
    if (tok !== V.token) return;
    if (du) { dl.href = du; dl.download = it.dlname || it.name; setBtn(dl, true); }
  }).catch(fail);
}
$('bX').onclick = closeViewer;
function closeViewer(){ V.token++; V.i = -1; $('vw').hidden = true; $('vB').innerHTML = ''; document.body.classList.remove('vopen'); markCur(); }
function step(d){ if (V.i < 0) return; var k = V.ctx.indexOf(V.i) + d; if (k >= 0 && k < V.ctx.length) openItem(V.ctx[k], null, V.ctx); }
$('bPrev').onclick = function(){ step(-1); };
$('bNext').onclick = function(){ step(1); };
$('bWide').onclick = function(){ var w = document.body.classList.toggle('wide'); this.textContent = w ? '나란히' : '넓게'; };
$('bTab').onclick = function(){ if (!V.url) return; var it = ITEMS[V.i]; window.open(it.kind === 'pdf' ? pdfSrc(V.url, it, +$('vPage').value || 1) : V.url, '_blank'); };
$('vPage').addEventListener('keydown', function(e){ if (e.key === 'Enter') goPdfPage(this.value); });
$('vSpread').addEventListener('keydown', function(e){ if (e.key === 'Enter' && +this.value > 0) goPdfPage(Math.floor(+this.value / 2) + 1); });
document.addEventListener('keydown', function(e){
  var tag = (e.target.tagName || '').toLowerCase(), typing = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;
  if (e.key === 'Escape') { if (V.i >= 0) { closeViewer(); e.preventDefault(); } else if (tag === 'input' && $('q').value) { $('q').value = ''; runSearch(); } return; }
  if (typing) return;
  if (e.key === '/' && !$('app').hidden) { setTab('F'); $('q').focus(); e.preventDefault(); return; }
  if (V.i >= 0 && e.key === 'ArrowLeft') { step(-1); e.preventDefault(); }
  if (V.i >= 0 && e.key === 'ArrowRight') { step(1); e.preventDefault(); }
});
(function(){
  var g = $('grip'), dragging = false;
  g.addEventListener('pointerdown', function(e){ dragging = true; g.setPointerCapture(e.pointerId); document.body.style.userSelect = 'none'; document.querySelectorAll('iframe').forEach(function(f){ f.style.pointerEvents = 'none'; }); });
  g.addEventListener('pointermove', function(e){ if (!dragging) return; var w = Math.min(Math.max(window.innerWidth - e.clientX, 420), window.innerWidth - 320); document.documentElement.style.setProperty('--vw', w + 'px'); });
  g.addEventListener('pointerup', function(){ dragging = false; document.body.style.userSelect = ''; document.querySelectorAll('iframe').forEach(function(f){ f.style.pointerEvents = ''; }); });
})();

/* ---------- small markdown renderer (headings, lists, tables, quotes, code) ---------- */
function md2html(src, linkIds){
  var L = src.replace(/\r/g, '').split('\n'), out = [], para = [], list = null, inCode = false, tbl = null, quote = [];
  function inl(s){
    var h = esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>');
    if (linkIds) h = h.replace(/\[(f\d{3})\]/g, function(m, id){ return BYID[id] != null ? '<a class="fid" href="#" data-f="' + id + '" title="' + esc(ITEMS[BYID[id]].name) + '">[' + id + ']</a>' : m; });
    return h;
  }
  function fp(){ if (para.length) { out.push('<p>' + inl(para.join(' ')) + '</p>'); para = []; } }
  function fl(){ if (list) { out.push('</' + list + '>'); list = null; } }
  function ft(){ if (tbl) { var h = '<table>'; tbl.forEach(function(r, n){ var cells = r.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|'); h += '<tr>' + cells.map(function(c){ return (n ? '<td>' : '<th>') + inl(c.trim()) + (n ? '</td>' : '</th>'); }).join('') + '</tr>'; }); out.push(h + '</table>'); tbl = null; } }
  function fq(){ if (quote.length) { out.push('<blockquote>' + quote.map(inl).join('<br>') + '</blockquote>'); quote = []; } }
  function flush(){ fp(); fl(); ft(); fq(); }
  L.forEach(function(l){
    if (/^```/.test(l)) { flush(); out.push(inCode ? '</pre>' : '<pre>'); inCode = !inCode; return; }
    if (inCode) { out.push(esc(l) + '\n'); return; }
    var m;
    if (/^\s*\|/.test(l)) { fp(); fl(); fq(); if (/^[\s|:-]+$/.test(l) && l.indexOf('-') >= 0) return; (tbl = tbl || []).push(l); return; } else ft();
    if ((m = /^>\s?(.*)$/.exec(l))) { fp(); fl(); quote.push(m[1]); return; } else fq();
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)) { flush(); out.push('<hr>'); return; }
    if ((m = /^(#{1,6})\s+(.*)$/.exec(l))) { flush(); out.push('<h' + m[1].length + '>' + inl(m[2]) + '</h' + m[1].length + '>'); return; }
    if ((m = /^\s*[-*+]\s+(.*)$/.exec(l))) { fp(); if (list !== 'ul') { fl(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inl(m[1]) + '</li>'); return; }
    if ((m = /^\s*\d+[.)]\s+(.*)$/.exec(l))) { fp(); if (list !== 'ol') { fl(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + inl(m[1]) + '</li>'); return; }
    if (!l.trim()) { flush(); return; }
    fl(); para.push(l);
  });
  flush(); if (inCode) out.push('</pre>');
  return out.join('');
}
})();
